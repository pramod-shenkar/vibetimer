<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B2E"/>
      <stop offset="100%" stop-color="#0F0C1B"/>
    </linearGradient>

    <!-- Pulse Ring Gradient -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A7CFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#5443D6" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Core Dot Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A79BFF"/>
      <stop offset="100%" stop-color="#6C5CE7"/>
    </linearGradient>
  </defs>

  <!-- App Icon Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Outer Vibration Waves -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#pulseGrad)" stroke-width="4" stroke-dasharray="8 8" opacity="0.4"/>
  <circle cx="256" cy="256" r="145" fill="none" stroke="#8A7CFF" stroke-width="6" opacity="0.3"/>
  
  <!-- Mindful Breathing / Ripple Rings -->
  <circle cx="256" cy="256" r="110" fill="none" stroke="#A79BFF" stroke-width="12" opacity="0.6"/>
  <circle cx="256" cy="256" r="75" fill="none" stroke="#C4BCFF" stroke-width="16" opacity="0.85"/>

  <!-- Center Zen Point -->
  <circle cx="256" cy="256" r="32" fill="url(#coreGrad)"/>
</svg>
